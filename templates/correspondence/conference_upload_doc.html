<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أرشفة وثيقة مؤتمر - {{ conference.title }}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', sans-serif; }
        .card-custom { border: none; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1"><i class="bi bi-mortarboard-fill text-warning me-2"></i> أرشفة وثيقة جديدة في المؤتمر</span>
            <div class="d-flex align-items-center text-white">
                <a href="{% url 'conference_detail' conference.id %}" class="btn btn-sm btn-outline-light me-2"><i class="bi bi-arrow-right"></i> عودة للمؤتمر</a>
                <a href="{% url 'user_logout' %}" class="btn btn-sm btn-outline-danger"><i class="bi bi-box-arrow-right"></i> خروج</a>
            </div>
        </div>
    </nav>

    <div class="container mb-5">
        {% if messages %}
            {% for message in messages %}
                <div class="alert {% if message.tags == 'error' %}alert-danger{% else %}alert-success{% endif %} py-2">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <div class="card card-custom p-4 max-width-800 mx-auto bg-white">
            <div class="mb-3 pb-2 border-bottom">
                <h4 class="fw-bold text-primary mb-1"><i class="bi bi-cloud-arrow-up-fill"></i> أرشفة ملف / ورقة علمية</h4>
                <p class="text-muted small mb-0">المؤتمر المرتبط: <strong>{{ conference.title }} (سنة {{ conference.year }})</strong></p>
            </div>

            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="row">
                    <div class="col-12 mb-3">
                        <label class="form-label small fw-bold">عنوان الوثيقة أو البحث *</label>
                        <input type="text" name="title" class="form-control" required placeholder="مثال: تطبيق الذكاء الاصطناعي في إدارة البيانات الجامعية">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label small fw-bold">تصنيف الوثيقة *</label>
                        <select name="document_type" class="form-select" required>
                            {% for val, label in doc_types %}
                                <option value="{{ val }}">{{ label }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label small fw-bold">اسم الباحث / المتحدث / المعد</label>
                        <input type="text" name="author_or_presenter" class="form-control" placeholder="مثال: د. محمد عبد الرحمن / د. أبو ذر">
                    </div>

                    <div class="col-12 mb-3">
                        <label class="form-label small fw-bold text-danger"><i class="bi bi-file-earmark-pdf-fill"></i> ملف المستند الأصلي (PDF فقط بحد أقصى 10MB) *</label>
                        <input type="file" name="file" class="form-control" accept=".pdf" required>
                    </div>

                    <div class="col-12 mb-4">
                        <label class="form-label small fw-bold">نبذة أو ملخص عن المستند (اختياري)</label>
                        <textarea name="notes" class="form-control" rows="4" placeholder="اكتب ملخصاً قصيراً لمحتوى الورقة أو توصيات الجلسة..."></textarea>
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a href="{% url 'conference_detail' conference.id %}" class="btn btn-secondary">إلغاء</a>
                    <button type="submit" class="btn btn-success px-4 fw-bold"><i class="bi bi-check-circle-fill"></i> أرشفة ورفع إلى Google Drive</button>
                </div>
            </form>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
